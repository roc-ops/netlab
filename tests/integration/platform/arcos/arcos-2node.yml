---
# ArcOS platform smoke test (issue #39) -- initial + OSPF + BGP on two nodes.
#
# CREATE / DEPLOY / PASS all live-verified 2026-08-29 (issue #87) on arcos:8.2.1A.P2:
#   create  -- renders clean
#   deploy  -- `netlab up` completes; initial+ospf+bgp all push and land in the running config
#              (protocol BGP b1 with both neighbours, protocol OSPF p1, protocol OSPF3 p1)
#   pass    -- OSPFv2 full-neighbor-count 1, OSPFv3 full-neighbor-count 1, and BGP
#              ESTABLISHED on BOTH AFs (10.8.0.2 IPV4_UNICAST, 2001:db8:80:2::1 IPV6_UNICAST,
#              1 prefix each way), read back with
#              echo 'show network-instance default protocol' | confd_cli -C -u admin
#
# The previous version of this comment said `netlab initial` config push was blocked by an
# Ansible network_cli/arrcus.arcos collection issue and asked for a re-run once resolved.
# That is stale: the device no longer pushes through network_cli at all. It uses sh-mode
# deployment through the mapped confd_cli wrapper (netlab_config_mode: sh in
# netsim/devices/arcos.yml), and it works. This is a claim that rotted in the SAFE
# direction -- it under-sold a device that had started working -- which is still rot.
#
# Use a multilab id when running by hand to avoid colliding with other labs. The plugin has
# to be loaded for the id to mean anything; `-s multilab.id=51` on its own is not merely
# inert here, it is a hard error (Invalid topology attribute multilab). With the plugin
# loaded, as below, override it with:
#   netlab up tests/integration/platform/arcos/arcos-2node.yml -s defaults.multilab.id=51
provider: clab
plugin: [ multilab ]
module: [ ospf, bgp ]
# The shared validation wait times, which already carry the ArcOS-specific ones this lab needs:
# arcos.ibgp_session is 150s because ArcOS rejects every BGP FSM transition until its startup
# config read completes. A numeric wait here would duplicate that number and then rot away from
# it. Dotted keys throughout, as in the sibling ocnos suite: a `defaults:` mapping block beside
# a `defaults.x:` key replaces it wholesale, and the constants vanish with no error.
defaults.sources.extra: [ ../../wait_times.yml ]
defaults.device: arcos
defaults.multilab.id: 51
nodes:
  r1:
    bgp.as: 65000
  r2:
    bgp.as: 65000
links:
- r1-r2

# Every claim the header comment makes, as a machine check. Written after measuring each one on
# a live lab (ml-95, 2026-09-08) -- not transcribed from the prose above, which is the failure
# mode #87 exists to prevent. Read from r1 only: this is a two-node lab and both ends are the
# same device, so r1's view of r2 is the whole adjacency.
validate:
  ospf_adj:
    description: OSPFv2 adjacency with r2 reaches FULL
    nodes: [ r1 ]
    devices: [ arcos ]
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for the OSPFv2 adjacency
    plugin: ospf_neighbor(nodes.r2.ospf.router_id)
  bgp_v4:
    description: iBGP session with r2 Established on the IPv4 AF
    nodes: [ r1 ]
    devices: [ arcos ]
    wait: ibgp_session
    wait_msg: Waiting for the IPv4 BGP session
    plugin: bgp_neighbor(node.bgp.neighbors,'r2')
  bgp_v6:
    description: iBGP session with r2 Established on the IPv6 AF
    nodes: [ r1 ]
    devices: [ arcos ]
    wait: ibgp_session
    wait_msg: Waiting for the IPv6 BGP session
    plugin: bgp_neighbor(node.bgp.neighbors,'r2',af='ipv6')
