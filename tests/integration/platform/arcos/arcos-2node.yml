---
# ArcOS platform smoke test (issue #39) -- initial + OSPF + BGP on two nodes.
#
# CREATE / DEPLOY / PASS all live-verified 2026-08-29 (issue #87) on arcos:8.2.1A.P2:
#   create  -- renders clean
#   deploy  -- `netlab up` completes; initial+ospf+bgp all push and land in the running config
#              (protocol BGP b1 with both neighbours, protocol OSPF p1, protocol OSPF3 p1)
#   pass    -- OSPFv2 full-neighbor-count 1, OSPFv3 full-neighbor-count 1, and BGP
#              ESTABLISHED on BOTH AFs (10.8.0.2 IPV4_UNICAST, 2001:db8:80:2::1 IPV6_UNICAST,
#              1 prefix each way), read back with
#              echo 'show network-instance default protocol' | confd_cli -C -u admin
#
# The previous version of this comment said `netlab initial` config push was blocked by an
# Ansible network_cli/arrcus.arcos collection issue and asked for a re-run once resolved.
# That is stale: the device no longer pushes through network_cli at all. It uses sh-mode
# deployment through the mapped confd_cli wrapper (netlab_config_mode: sh in
# netsim/devices/arcos.yml), and it works. This is a claim that rotted in the SAFE
# direction -- it under-sold a device that had started working -- which is still rot.
#
# Use a multilab id when running by hand to avoid colliding with other labs. The plugin has
# to be loaded for the id to mean anything; `-s multilab.id=51` on its own is not merely
# inert here, it is a hard error (Invalid topology attribute multilab). With the plugin
# loaded, as below, override it with:
#   netlab up tests/integration/platform/arcos/arcos-2node.yml -s defaults.multilab.id=51
provider: clab
plugin: [ multilab ]
module: [ ospf, bgp ]
defaults:
  device: arcos
  multilab:
    id: 51
nodes:
  r1:
    bgp.as: 65000
  r2:
    bgp.as: 65000
links:
- r1-r2
