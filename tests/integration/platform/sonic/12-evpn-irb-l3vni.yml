# SONiC EVPN symmetric-IRB (L3VNI inter-subnet) spike (issue #29) — mirrors
# ocnos-evpn-irb.yml. Two subnets (red, blue) in tenant VRF, stretched via VXLAN with
# an L3VNI. h1 (behind s1, subnet red) and h2 (behind s2, subnet blue) are in DIFFERENT
# subnets -- inter-subnet ping can only work through the L3VNI routing across the
# fabric, which is the symmetric-IRB datapath proof.
#
# docker-sonic-vs's orchagent bypassed as usual (kernel/FRR path, see
# templates/vxlan/sonic.j2 + templates/vlan/sonic.j2 for the create-before-address
# vrf-enslavement ordering this needed).
#   netlab up sonic-evpnirb.yml
#   python validate/sonic.py --module evpn_irb
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

module: [ vlan, vrf, ospf, bgp, vxlan, evpn ]
bgp.as: 65000

vrfs:
  tenant:
    evpn.transit_vni: 10099

vlans:
  red:
    mode: irb
    vrf: tenant
    vni: 10010
  blue:
    mode: irb
    vrf: tenant
    vni: 10020

nodes:
  s1:
  s2:
  h1:
    device: linux
  h2:
    device: linux

links:
- s1-s2
- s1:
    vlan.access: red
  h1:
- s2:
    vlan.access: blue
  h2:

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  l3vni:
    description: The L3VNI is up in the tenant VRF
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the L3VNI
    exec: vtysh -c "show evpn vni"
    valid: |
      'L3' in stdout and 'tenant' in stdout
  symmetric_irb:
    description: Symmetric IRB -- the remote subnet is reached via the L3VNI, not a bridged VNI
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 40
    wait_msg: Waiting for the type-5 route
    exec: vtysh -c "show ip route vrf tenant"
    valid: |
      'l3vni' in stdout
  datapath:
    description: Inter-subnet h1 -> h2 across the L3VNI
    nodes: [ h1 ]
    devices: [ linux ]
    wait: 40
    wait_msg: Waiting for the inter-subnet datapath
    exec: ping -c5 -W2 {{ hostvars.h2.interfaces[0].ipv4|ipaddr('address') }}
    valid: |
      '0% packet loss' in stdout
