# 2-node SONiC VLAN spike — issue #6 (config_db Vlan + kernel bridge datapath).
# Access VLAN "red" (IRB -> SVI with an IP) between s1 and s2, same shape as the
# ocnos/arcos vlan tests.  cd netlab/sonic && netlab up sonic-vlan.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

module: [ vlan ]

vlans:
  red:
    mode: irb

nodes: [ s1, s2 ]

links:
- s1:
  s2:
  vlan.access: red
