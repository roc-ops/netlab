# SONiC IPv6 static routing + prefix-lists — issue #16: dual-stack version of the static-route
# slice of sonic-routing.yml (issue #13). Verifies `ipv6 route` + `ipv6 prefix-list` actually
# render and install, not just that the Jinja has an {% if %} branch for them.
#   cd netlab/sonic && netlab up sonic-v6routing.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ routing ]

groups:
  routers:
    members: [ s1, s2 ]
    routing:
      prefix:
        stub-net6:
        - ipv6: 2001:db8:143::/48
          min: 64
          max: 64

nodes:
  s1:
    routing.static:
    - ipv6: 2001:db8:143:42::/64
      nexthop:
        node: s2
  s2:
    routing.static:
    - ipv6: 2001:db8:143:41::/64
      nexthop:
        node: s1

links:
- s1:
  s2:

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  static_installed:
    description: The IPv6 static route is installed, with a symbolically-resolved next hop
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 30
    exec: vtysh -c "show ipv6 route static"
    valid: |
      'S>*' in stdout and '2001:db8:143:42::/64' in stdout
  prefix_list:
    description: The IPv6 prefix-list is present with its ge/le bounds
    nodes: [ s1 ]
    devices: [ sonic ]
    exec: vtysh -c "show ipv6 prefix-list"
    valid: |
      'ge 64 le 64' in stdout
