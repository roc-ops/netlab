# SONiC VRF IPv6 + v6 route-leaking — issue #16 follow-on: dual-stack version of
# sonic-vrfleak.yml. On s1, VRF blue imports VRF red's route-targets -> red's IPv6 stub
# prefix should appear in blue's v6 RIB (FRR rt vpn import, intra-node control-plane leak,
# independent of the VS dataplane -- same class as the v4 leak test).
#   cd netlab/sonic && netlab up sonic-vrfv6.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64
  lan:
    ipv6: 2001:db8:1::/48
    prefix6: 64

module: [ vrf, bgp ]
bgp.as: 65000
vrfs:
  red:
  blue:
    import: [ red, blue ]
nodes: [ s1, s2 ]
links:
- s1-s2
- s1:
  vrf: red
  type: stub
- s1:
  vrf: blue
  type: stub

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  leak_in:
    description: red's IPv6 prefix is imported into blue via the route target
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 40
    wait_msg: Waiting for the RT import
    exec: vtysh -c "show ipv6 route vrf blue"
    valid: |
      'vrf red' in stdout
  leak_is_one_way:
    description: blue's IPv6 prefix does NOT appear in red
    nodes: [ s1 ]
    devices: [ sonic ]
    exec: vtysh -c "show ipv6 route vrf red"
    valid: |
      'IPv6 unicast VRF red' in stdout and 'vrf blue' not in stdout
    fail: |
      blue leaked into red, or the VRF table came back empty -- the positive half of this check
      exists so that "no output" cannot masquerade as "no leak"
