# SONiC SRv6 over IS-IS (issue #29) — mirrors arcos-srv6.yml / ocnos-srv6.yml.
# Per-node locator from srv6.locator_pool; IS-IS advertises the SRv6 locator + auto
# End/End.X SIDs. CONFIRMED: FRR's srv6/frr.j2 uses kernel seg6 (net.ipv6.seg6_enabled),
# NOT the MPLS label FIB, so — unlike mpls/sr — this needs NO host modprobe
# prerequisite and gets REAL kernel seg6local routes (`ip -6 route` shows
# `encap seg6local action End`/`End.X`) straight out of the box. Cross-node proof: s1's
# IS-IS LSDB carries s2's locator (and vice versa), not just a local SID.
# Same open follow-up as OcNOS's srv6 result: SRv6-OAM ping to the End SID (uN) does
# NOT get answered even though the kernel seg6local route is installed — proven
# control+kernel-plane, datapath ping unresolved (not chased further here; OKF
# follow-up, matches the OcNOS precedent exactly).
#   netlab up sonic-srv6.yml
#   python validate/sonic.py --module srv6
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52
module: [ isis, srv6 ]
srv6.bgp: false
srv6.igp: [ isis ]
addressing:
  loopback:
    ipv6: 2001:db8:a::/48
  p2p:
    ipv6: 2001:db8:1::/48
nodes: [ s1, s2 ]
links: [ s1-s2 ]

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

# NOTE: this row claims a control-plane and kernel-state result and nothing more. No traffic is
# sent through an SRv6 SID here, and these checks deliberately do not pretend otherwise.
validate:
  isis:
    description: IS-IS adjacency is Up
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the IS-IS adjacency
    exec: vtysh -c "show isis neighbor"
    valid: |
      'Up' in stdout
  kernel_end:
    description: A real kernel seg6local End (uN) route exists
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 40
    exec: ip -6 route show table all
    valid: |
      'seg6local action End' in stdout
  kernel_endx:
    description: A real kernel seg6local End.X (uA) route exists
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 40
    exec: ip -6 route show table all
    valid: |
      'action End.X' in stdout
  remote_locator:
    description: The REMOTE node's locator was advertised by IS-IS and installed
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 40
    wait_msg: Waiting for the remote SRv6 locator
    exec: vtysh -c "show ipv6 route isis"
    valid: |
      '{{ hostvars.s2.srv6.locator }}' in stdout
    fail: the remote locator never arrived -- cross-node advertisement is what this row claims
