# SONiC per-VRF OSPFv3 — issue #16 follow-on: dual-stack version of sonic-vrf.yml (link in VRF
# red with per-VRF OSPF). Needs features.vrf.ospfv3 (this pass adds it to sonic.yml) --
# vrf/frr.frr-config.j2 (upstream, vendored) already renders `router ospf6 vrf <name>` once the
# feature flag unlocks it and the VRF has an ipv6 AF.
#   cd netlab/sonic && netlab up sonic-vrfv6ospf.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ vrf, ospf ]
vrfs:
  red:
nodes: [ s1, s2 ]
links:
- s1:
  s2:
  vrf: red

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  vrf_ospfv3:
    description: OSPFv3 adjacency Full inside VRF red specifically
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the per-VRF OSPFv3 adjacency
    exec: vtysh -c "show ipv6 ospf6 vrf red neighbor"
    valid: |
      'Full' in stdout
  not_in_default:
    description: The default VRF has no OSPFv3 instance -- what makes this a VRF result
    nodes: [ s1 ]
    devices: [ sonic ]
    exec: vtysh -c "show ipv6 ospf6 neighbor"
    valid: |
      'OSPFv3 instance not found' in stdout and 'Full' not in stdout
    fail: |
      the default VRF has an OSPFv3 adjacency, or the command returned nothing -- the positive
      half of this check exists so empty output cannot satisfy the negative half
