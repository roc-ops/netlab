# SONiC ebgp.multihop plugin (issue #19). eBGP session between the two LOOPBACKS
# (multihop, up to 255 hops) across an AS boundary (s1 AS65001 <-> s2 AS65002),
# with s1 presenting a local-as of 65101. netlab does NOT run an IGP across an
# eBGP AS boundary, so loopback reachability is modeled with the routing.static
# module (static route to the remote loopback via the connected transit subnet) --
# the realistic multihop underlay. The connected link carries NO direct BGP session
# (bgp: False) so the ONLY session is the multihop loopback-to-loopback one.
# FRR-delegated (templates/ebgp.multihop/sonic.j2 = include frr.j2).
#
# The statics are written SYMBOLICALLY (node: / nexthop.node:) and must stay that way.
# They were literals -- 10.0.0.2/32 via 10.1.0.2 -- until issue #87. netlab's default pools
# had since moved to 10.8.0.0/24 (loopback) and 10.10.0.0/30 (p2p), so the next hop was on no
# interface, the static never entered the RIB at all, the remote loopback was unreachable and
# both multihop sessions sat in Active forever. The recorded "Established" result had been
# unreproducible for as long as nobody re-ran it. The symbolic form resolves against whatever
# the pools are on the day it runs, and it covers IPv4 and IPv6 in one entry -- the literal
# form only ever provided IPv4 statics, so the v6 session it also builds could never have
# come up either.
#
# Live-verified 2026-08-29 (issue #87): both AFs reach Established, statics installed
# (S>* 10.8.0.2/32 via 10.10.0.2 and S>* 2001:db8:80:2::/64 via 2001:db8:100::2), 1 prefix
# received each way on each AF.
provider: clab
plugin: [ multilab, ebgp.multihop ]
defaults:
  device: sonic
  multilab:
    id: 52

module: [ bgp, ospf, routing ]
bgp.advertise_loopback: True

bgp.multihop.sessions:
- s1:
    local_as: 65101
  s2:

nodes:
  s1:
    bgp.as: 65001
    routing.static:
    - node: s2
      nexthop.node: s2
  s2:
    bgp.as: 65002
    routing.static:
    - node: s1
      nexthop.node: s1

links:
- s1:
  s2:
  bgp: False
