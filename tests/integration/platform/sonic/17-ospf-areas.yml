# SONiC ospf.areas plugin (issue #19): s1 is an ABR (loopback area 0 + link area 1
# stub); s2 is a pure stub-area router. FRR-delegated.
provider: clab
plugin: [ multilab, ospf.areas ]
defaults:
  device: sonic
  multilab:
    id: 52
module: [ ospf ]
nodes:
  s1:
    ospf.areas: [ { area: 0.0.0.1, kind: stub } ]
  s2:
    ospf.areas: [ { area: 0.0.0.1, kind: stub } ]
links:
- s1:
    ospf.area: 0.0.0.0
  type: stub
- s1:
  s2:
  ospf.area: 0.0.0.1

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  stub_area:
    description: Area 0.0.0.1 is a stub area, not merely configured as one
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 40
    exec: vtysh -c "show ip ospf"
    valid: |
      'Area ID: 0.0.0.1 (Stub)' in stdout
  adjacency_v2:
    description: OSPFv2 adjacency Full in the stub area
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the OSPFv2 adjacency
    exec: vtysh -c "show ip ospf neighbor"
    valid: |
      'Full' in stdout
  adjacency_v3:
    description: OSPFv3 adjacency Full -- dual-stack lab, so both AFs are checked
    nodes: [ s1, s2 ]
    devices: [ sonic ]
    wait: 50
    exec: vtysh -c "show ipv6 ospf6 neighbor"
    valid: |
      'Full' in stdout
