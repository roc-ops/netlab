# SONiC bgp.policy plugin — issue #19. Applies FRR route-maps to an eBGP session:
#   * a NAMED inbound route-map (routing.policy) that matches a prefix-list and
#     sets local-preference + a standard community  (match + set)
#   * plugin COMPOUND attributes (bgp.weight direct, bgp.med -> auto out route-map)
# s2 originates 10.43.99.0/24 (connected stub); s1 receives it and the inbound
# policy rewrites LocPref=250 + community 65001:100, and weight=50 (best-path effect).
#   cd netlab/sonic && netlab up sonic-bgppolicy.yml
provider: clab
plugin: [ multilab, bgp.policy ]
defaults:
  device: sonic
  multilab:
    id: 52
module: [ bgp, routing ]

groups:
  routers:
    members: [ s1, s2 ]
    routing:
      prefix:
        cust-net:
        - ipv4: 10.43.0.0/16
          min: 24
          max: 24
      policy:
        set-lp:                       # inbound: match prefix-list -> set locpref + community
        - match:
            prefix: cust-net
          set:
            locpref: 250
            community:
              standard: [ "65001:100" ]
        - sequence: 100                # permit the rest (FRR route-maps deny by default)

nodes:
  s1:
    bgp.as: 65001
  s2:
    bgp.as: 65002
    bgp.import: [ connected ]

links:
- s1:
    bgp.policy.in: set-lp             # named inbound route-map
    bgp.weight: 50                    # direct neighbor attribute
    bgp.med: 111                      # compound -> auto out route-map
  s2:
- s2:                                 # s2's connected stub, redistributed into BGP
  type: stub
  prefix: 10.43.99.0/24

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  inbound_policy:
    description: locpref, weight and community all applied to the received prefix
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the prefix to arrive
    exec: vtysh -c "show ip bgp 10.43.99.0/24"
    valid: |
      'localpref 250' in stdout and 'weight 50' in stdout and '65001:100' in stdout
    fail: at least one of locpref/weight/community did not take
  outbound_med:
    description: The compound attribute produced an outbound route-map that set MED on the far side
    nodes: [ s2 ]
    devices: [ sonic ]
    wait: 40
    exec: vtysh -c "show ip bgp {{ hostvars.s1.loopback.ipv4 }}"
    valid: |
      'metric 111' in stdout
