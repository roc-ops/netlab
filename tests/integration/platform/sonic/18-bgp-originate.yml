# SONiC bgp.originate — issue #19. A node injects a prefix into BGP for which it
# has NO interface/route (native bgp.originate, now part of the BGP module). s1
# originates 10.201.9.0/24; the eBGP peer s2 must receive & install it.
#   cd netlab/sonic && netlab up sonic-bgporiginate.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52
module: [ bgp ]
nodes:
  s1:
    bgp.as: 65001
    bgp.originate: [ 10.201.9.0/24 ]
  s2:
    bgp.as: 65002
links:
- s1-s2

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  received:
    description: The originated prefix is received by the eBGP peer
    nodes: [ s2 ]
    devices: [ sonic ]
    wait: 40
    wait_msg: Waiting for the originated prefix
    exec: vtysh -c "show ip bgp"
    valid: |
      '10.201.9.0/24' in stdout
