# SONiC EVPN-VXLAN — issue #13: OSPF underlay + iBGP EVPN over loopbacks, VLAN red
# (pure L2, vni 10043) stretched between the two VTEPs. h1/h2 are linux hosts behind
# untagged access ports; h1 ping h2 can ONLY succeed through the VXLAN tunnel across
# the routed core — the definitive datapath proof. Mirrors ocnos-vxlan.yml.
# docker-sonic-vs's orchagent can't program the dataplane, so the L2VNI is built on
# the FRR/kernel path (traditional bridge + kernel vxlan netdev); zebra drives EVPN.
#   cd netlab/sonic && netlab up sonic-vxlan.yml
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52

module: [ vlan, ospf, bgp, vxlan, evpn ]
bgp.as: 65000

vlans:
  red:
    mode: bridge
    vni: 10043

nodes:
  s1:
  s2:
  h1:
    device: linux
  h2:
    device: linux

links:
- s1-s2
- s1:
    vlan.access: red
  h1:
- s2:
    vlan.access: red
  h2:

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  evpn_session:
    description: EVPN address family Established between the VTEPs
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 50
    wait_msg: Waiting for the EVPN session
    show: bgp l2vpn evpn summary json
    valid: |
      peers['{{ hostvars.s2.loopback.ipv4|ipaddr('address') }}'].state == 'Established'
  remote_vtep:
    description: The remote VTEP was learned on the L2VNI
    nodes: [ s1 ]
    devices: [ sonic ]
    wait: 40
    wait_msg: Waiting for the remote VTEP
    exec: vtysh -c "show evpn vni"
    valid: |
      '{{ vlans.red.vni }}' in stdout
  datapath_v4:
    description: h1 reaches h2 across the VXLAN tunnel, IPv4
    nodes: [ h1 ]
    devices: [ linux ]
    wait: 40
    wait_msg: Waiting for the overlay datapath
    exec: ping -c5 -W2 {{ hostvars.h2.interfaces[0].ipv4|ipaddr('address') }}
    valid: |
      '0% packet loss' in stdout
  datapath_v6:
    description: h1 reaches h2 across the VXLAN tunnel, IPv6 -- never recorded until issue 87
    nodes: [ h1 ]
    devices: [ linux ]
    wait: 40
    exec: ping -6 -c4 -W2 {{ hostvars.h2.interfaces[0].ipv6|ipaddr('address') }}
    valid: |
      '0% packet loss' in stdout
