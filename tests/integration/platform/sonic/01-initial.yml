# 1-node SONiC (clab) bring-up smoke test — issue #40.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic
  multilab:
    id: 52
nodes:
  s1:

# Validation blocks (issue #87). Every check below encodes a result that was verified by hand
# on this lab first; none of them is a claim nobody measured. Addresses are derived from node
# data rather than written as literals -- a hardcoded address is exactly what rotted rows 16
# and 21, and a test asset that hardcodes an address the framework allocates is a rot generator.

validate:
  hostname:
    description: The node's hostname was set
    nodes: [ s1 ]
    devices: [ sonic ]
    exec: hostname
    valid: |
      stdout.strip() == 's1'
  loopback:
    description: Loopback0 carries the allocated IPv4 and IPv6 loopback addresses
    nodes: [ s1 ]
    devices: [ sonic ]
    exec: ip -br addr show Loopback0
    valid: >-
      '{{ loopback.ipv4|ipaddr('address') }}' in stdout
      and '{{ loopback.ipv6|ipaddr('address') }}' in stdout
    fail: the loopback is missing an address on one or both AFs
