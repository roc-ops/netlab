#
# NTP as a lab default -- fork-only.
#
# WHY THIS EXISTS
#   We correlate logs across five NOSes plus the physical fabric. A device whose clock is
#   minutes out makes that correlation guesswork, and an evening was lost to exactly that.
#   This file makes the affected devices point at the lab's time server with no per-topology
#   opt-in: any topology built on this fork gets it.
#
# WHY ONLY THESE TWO DEVICES -- read before adding more
#   Container-based devices (frr, linux, sonic, eos/cEOS, srlinux, dnos, arcos ...) share the
#   HOST KERNEL CLOCK. There is no time namespace, so they cannot drift from the netlab host
#   and cannot be configured to, and without CAP_SYS_TIME a container could not step its clock
#   even if asked. Measured on the ml-20 showcase: the host and all seven container platforms
#   reported the SAME SECOND (20:55:48 UTC, 2026-08-29). Configuring NTP on them would be
#   ceremony that LOOKS like the problem is solved. Their absence here is a deliberate,
#   measured finding, not an oversight -- see docs/lab/10-time.md before "fixing" it.
#
#   The devices listed below are VM-BACKED (vrnetlab wraps a QEMU VM), so each has its OWN
#   clock and does drift. Measured on a live n9kv: host 21:00:00 UTC, VM 20:55:52 UTC --
#   4m08s out, while NX-OS itself reported "Time source is NTP" with no server configured.
#
# HOW IT IS SCOPED
#   `devices.<dev>.node.config` is copied into every node of that device type by
#   augment/nodes.py:augment_node_device_data. That scopes the setting to the platform, which
#   a group cannot do -- group membership is by node NAME, and a `groups.all` default would
#   demand an ntp template for EVERY platform (a missing one is a hard error at `netlab
#   create`, not a skip).
#
#   Note the merge rule: the device default applies only when the node does not already have
#   a `config` attribute ("if not k in n"). A topology that sets its own `config:` on one of
#   these nodes therefore REPLACES this default rather than adding to it, and that node gets
#   no NTP. That is the documented escape hatch, but it is silent -- if you set `config:` on
#   an nxos or ocnos node, list `ntp` yourself.
#
# ON A NETLAB HOST THAT DOES NOT SERVE TIME
#   The templates point at the lab's management gateway, which is always the netlab host. If
#   that host does not run an NTP server, this configures a client aimed at nothing: the
#   device simply does not synchronise. No error, no breakage -- and no signal either, which
#   is the trap. `show ntp peer-status` (OcNOS) / `show ntp peers` (NX-OS) is how you tell,
#   and docs/lab/10-time.md records what serving requires.
#
# `_top` is how a file under defaults/ edits the GLOBAL defaults rather than its own
# namespace. netsim/utils/read.py:include_yaml files every included file under a key named
# after the FILE (defaults/addressing.yml -> defaults.addressing), so a bare `devices:` key
# here would land in `defaults.roc-ntp.devices` and do nothing at all -- silently. `_top` is
# merged into the parent defaults instead, which is the same idiom the modules use
# (netsim/modules/vrf.yml, routing.yml, vlan.yml, stp.yml).
_top:
  devices:
    nxos:
      node:
        config: [ ntp ]
    ocnos:
      node:
        config: [ ntp ]
