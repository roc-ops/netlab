#
# NTP as a lab default -- the OcNOS half. Fork-only, and that is the point.
#
# WHY THIS FILE ONLY NAMES ocnos
#   The nxos half of this default deliberately does NOT live here. It lives in the RocContLab
#   repo (lab/netlab.yml -> ~/.netlab.yml), and the split is by DEVICE OWNERSHIP, not by taste:
#
#     * `ocnos` is a FORK device -- it exists only in trees that carry this file, so a default
#       naming it can only ever be seen by a netlab that knows what it is. It also appears in
#       ZERO files of the upstream transformation-test corpus, so defaulting it changes no
#       expected output and breaks no test. Verified: 295 passed, 1 skipped.
#
#     * `nxos` is an UPSTREAM device with upstream fixtures. Defaulting it HERE adds
#       `config: [ntp]` to the transformed output of six upstream test cases
#       (tests/topology/expected/{bgp-ibgp,dual-stack,eigrp-feature-test,isis-feature-test,
#       ospf,unnumbered}.yml -- 8 node blocks, 16 lines) and fails the suite by construction.
#       That corpus is generated from upstream's own inputs; a fork default makes it wrong.
#
#   The rule worth remembering, because it is not obvious and it cost a merge:
#   A FORK-LEVEL DEFAULT ON A FORK-ONLY DEVICE COSTS NOTHING. A FORK-LEVEL DEFAULT ON AN
#   UPSTREAM DEVICE MAKES UPSTREAM'S GENERATED FIXTURES WRONG.
#
#   The converse is just as sharp, and is why nxos went to the box rather than everything:
#   a BOX-LEVEL default naming a FORK device breaks EVERY lab run from a tree that does not
#   define it -- including labs with no such node. `devices.ocnos.node.config` in
#   ~/.netlab.yml creates a partial defaults.devices.ocnos entry, and netlab validates every
#   device in that dictionary regardless of what the topology uses:
#       IncorrectValue in devices: Device ocnos ... does not have interface_name attribute
#   A two-node FRR topology fails on that. So ocnos must be defaulted HERE, next to the
#   device definition, and nowhere else.
#
# WHY ONLY VM-BACKED DEVICES GET NTP AT ALL
#   Container devices (frr, linux, sonic, eos, srlinux, dnos, arcos ...) share the HOST KERNEL
#   CLOCK -- there is no time namespace, so they cannot drift from the netlab host and could
#   not step a clock anyway without CAP_SYS_TIME. Measured on the ml-20 showcase: the host and
#   all seven container platforms reported the SAME SECOND. Configuring NTP on them would be
#   ceremony that LOOKS like the problem is solved. Their absence here is a measured decision,
#   not an oversight -- see docs/lab/10-time.md before "fixing" it.
#
#   ocnos runs under vrnetlab, so it is a QEMU VM with its own clock. Measured: no time source
#   at all before this, then a 1295.649 ms first-poll offset, settling to 1.66 ms.
#
# THE MERGE RULE THAT BITES
#   `devices.<dev>.node.config` is copied into a node only when the node has no `config`
#   attribute already (augment/nodes.py, `if not k in n`). A topology that sets its own
#   `config:` on an ocnos node therefore REPLACES this default and that node silently gets no
#   NTP -- no warning, and a node that boots looking fine. If you set `config:` on an ocnos
#   node, list `ntp` yourself.
#
# `_top` is how a file under defaults/ edits the GLOBAL defaults rather than its own
# namespace. netsim/utils/read.py:include_yaml files every included file under a key named
# after the FILE (defaults/addressing.yml -> defaults.addressing), so a bare `devices:` key
# here would land in `defaults.roc-ntp.devices` and do nothing at all -- silently. `_top` is
# merged into the parent defaults instead, which is the same idiom the modules use
# (netsim/modules/vrf.yml, routing.yml, vlan.yml, stp.yml).
#
_top:
  devices:
    ocnos:
      node:
        config: [ ntp ]
