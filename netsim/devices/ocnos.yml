---
description: IP Infusion OcNOS
support:
  level: best-effort
  caveats:
  - OcNOS CLI (cmlsh) has no non-interactive exec mode; use the ipinfusion.ocnos
    Ansible collection (network_cli) for config push/fetch, not raw SSH commands.
  - OSPF/OSPFv3 network-membership changes on an already-running process return a
    non-empty commit notice ("Use 'clear ip[v6] ospf process'...") that the
    ocnos_config module treats as a failed task, aborting later modules for that
    host in the same play. Run 'netlab initial' a second time after the first OSPF
    network/area change on a node to let subsequent modules deploy.
interface_name: eth{ifindex}
ifindex_offset: 1
mgmt_if: eth0
loopback_interface_name: '{"lo" if not ifindex else "loopback" + str(ifindex)}'
tunnel_interface_name: Tunnel{ifindex}
lag_interface_name: '{"sa" if lag.get("lacp","") == "off" else "po"}{lag.ifindex}'
role: router
group_vars:
  ansible_network_os: ipinfusion.ocnos.ocnos
  ansible_connection: network_cli
  netlab_device_type: ocnos
  collections:
  - ipinfusion.ocnos
features:
  initial:
    ipv4:
      unnumbered: false
    ipv6:
      lla: true
    roles: [ router ]
    system_mtu: true
    collect: true
  bfd: true
  tunnel:
    gre: true
  dhcp:
    client:
      ipv4: true
    relay: true
  gateway:
    protocol: [ vrrp ]
    vrrp:
      version: true
  lag:
    passive: true
  routing:
    static:
      vrf: true
    prefix: true
    aspath: true
    community:
      standard: true
    policy:
      match:
        prefix: true
        aspath: true
        community:
          standard: true
      set:
        locpref: true
        med: true
        prepend: true
        weight: true
        community:
          standard: true
  ospf:
    default: true
    password: true
    digest: true
    priority: true
    timers: true
    areas:
      external_range: OcNOS does not model NSSA type-7 ranges
      external_filter: OcNOS does not model NSSA type-7 range suppression
  stp:
    supported_protocols: [ stp, rstp, mstp ]
    enable_per_port: true
  ripv2:
    ipv4: true
  isis:
    circuit_type: true
    import: [ connected, bgp, ospf ]
  mpls:
    ldp: true
    vpn: true
  sr:
    af: [ ipv4 ]
    protocol: [ isis ]
  srv6:
    isis: true
  vxlan: true
  evpn:
    transport: [ vxlan, mpls ]
    irb: true
    multihoming:
      lag: true
      interface: false
      esi_auto: true
      modes: [ all-active ]
  vrf:
    ospfv2: true
    bgp: true
    isis: true
  vlan:
    model: l3-switch
    svi_interface_name: "vlan1.{vlan}"
    subif_name: "{ifname}.{subif_index}"
    native_routed: true
  bgp:
    activate_af: true
    ipv6_lla: false
    local_as: true
    password: true
    timers: true
    multihop: true
    import: [ connected, static, isis, ospf, vrf ]
    community:
      standard: [ standard ]
      extended: [ standard, extended ]
clab:
  image: vrnetlab/ipinfusion_ocnos:7.0.0-262
  mtu: 1500
  node:
    kind: ipinfusion_ocnos
  group_vars:
    ansible_user: ocnos
    ansible_ssh_pass: ocnos
    netlab_console_connection: ssh
    netlab_show_command: [ show ]
external:
  image: none
graphite.icon: router
