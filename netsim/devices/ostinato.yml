---
description: Ostinato drone traffic engine (OTG-Ostinato backend, GPL drone binary)
interface_name: eth{ifindex}
mgmt_if: eth0
role: host
# The drone's own interface enumeration runs once at process start, and Ostinato's
# gRPC/GUI control plane (port 7878) is the only supported way to program traffic --
# netlab must never touch interface addressing or routing config on this node. Mirrors
# ixia_c.yml's rationale for skip_config.
skip_config: [ initial, routing ]
features:
  initial:
    collect: false
    reload: false
    ipv4:
      unnumbered: peer
    ipv6:
      lla: true
      use_ra: true
    roles: [ host ]
  routing:
    static: true   # role:host needs this to reach its default gateway; no other routing config is generated
group_vars:
  ansible_network_os: linux
  ansible_connection: docker
  ansible_user: root
  ansible_python_interpreter: auto_silent
  netlab_linux_distro: vanilla
  netlab_lldp_enable: False
  netlab_net_tools: False
clab:
  # 'image' at the top level of clab: (not nested under node:) becomes n.box via netlab's
  # standard device-box resolution -- same pattern ixia_c.yml uses.
  image: otg-drone:1.3.0-1build3
  # Sentinel that mirrors ixia_c.yml's node_config.initial trick: giving this device ANY
  # _node_config['initial'] entry makes augment/nodes.py's cleanup_non_ansible_config()
  # register 'initial' in netlab_ansible_skip_module, which is the ONLY thing that
  # suppresses tasks/deploy-module.yml's unconditional "Deploy initial configuration"
  # play (ansible/initial-config.ansible lines 17-25 run for ALL hosts, without ever
  # consulting the device's own skip_config list -- that's a routing/bgp/etc.-module-only
  # guarantee, not an 'initial'-module one). Without this, 'netlab up' fails hard with
  # "Cannot find initial configuration template for linux" on this host-like device.
  # skip_config: [initial, ...] above then filters this same entry back out of
  # clab.config_templates in providers/clab/binds.py's add_config_filemaps(), so no actual
  # script ever gets generated or executed -- the ':ns' value itself is inert, only its
  # presence as a key matters. Discovered + verified during Plan 2 Task 4 bring-up.
  node_config:
    initial: :ns
  node:
    kind: linux
    # Ostinato's drone enumerates interfaces once at process start; containerlab attaches
    # data links (eth1) after the container is already running, so the stock CMD ["drone"]
    # races the link attach and never sees eth1. Wait for it before exec'ing drone. Proven
    # in Task 1 (~/otg/netlab/ostinato-spike/ostinato.clab.yml).
    #
    # Keys nested under clab.node.* in a netlab device file get flattened into the actual
    # per-node node.clab.* attribute namespace used by the clab.j2 render template and by
    # providers/clab/binds.py (confirmed empirically against ixia_c.yml's clab.node.kind /
    # clab.node.config_templates, and reproduced here with clab.node.cmd rendering
    # correctly as a top-level 'cmd:' in the generated clab.yml). Keys placed directly at
    # clab.<key> (not nested under node:) do NOT reach node.clab.<key> this way -- 'cmd' at
    # the top level was silently dropped in testing.
    # ARP FLUX IS A CORRECTNESS BUG ON THIS DEVICE, NOT A TUNING PREFERENCE.
    #
    # An engine node carries several macvlans (eth1..ethN, one per subscriber plus the
    # network-side port) in ONE network namespace, sharing one IP stack. Linux will by
    # default answer an ARP request for ANY locally-configured address out ANY interface,
    # so a peer asking "who has <network-side address>" can be answered with the MAC of a
    # SUBSCRIBER macvlan. The peer then sends that flow's return traffic to an interface
    # that is not the measurement point.
    #
    # Measured on 2026-09-19, VLAN 951: the Casa's ARP entry for 203.0.113.7 (eth2,
    # aa:c1:ab:b3:3e:b5) pointed at aa:c1:ab:00:09:53 -- eth5, the VLAN 953 macvlan in the
    # SAME container, and 330 hours stale. Upstream measured 72.2% loss, then 100% loss
    # 45 minutes later, while downstream stayed at 0.6%. 45,276 of 45,570 lost frames were
    # UNATTRIBUTABLE: no hop counter anywhere admitted a drop, because nothing dropped
    # them -- the CMTS forwarded them correctly to a MAC that another macvlan in this very
    # container happily accepted. Setting these two knobs took upstream to 0.0% loss and
    # unattributed frames from 45,276 to 1.
    #
    # `all` is the right knob, not the per-interface one: the kernel takes
    # max(conf/all/X, conf/<iface>/X) for both of these, so `all` covers macvlans created
    # AFTER the container starts -- which is all of them, since clab attaches links later.
    #
    # Written straight to /proc rather than declared, for two verified reasons. The image
    # is minimal: no `sysctl`, no `ip`, no `arping` (only shell redirection is available).
    # And netlab's clab provider cannot carry a `sysctls:` node key at all -- its
    # attributes.node._keys allowlist is binds/kind/config_templates/type/cmd/dns/env/
    # ports/image/startup-config/srl-agents/license/runtime/startup-delay/restart-policy/
    # network-mode/exec, and `sysctl` appears nowhere in providers/clab.yml. A declarative
    # sysctls block here would be SILENTLY DROPPED, exactly as a misplaced `cmd` was during
    # bring-up. Verified 2026-09-19 that this container may write /proc/sys/net itself
    # (it holds NET_ADMIN and has its own netns).
    cmd: sh -c "echo 1 > /proc/sys/net/ipv4/conf/all/arp_ignore; echo 2 > /proc/sys/net/ipv4/conf/all/arp_announce; while [ ! -e /sys/class/net/eth1 ]; do sleep 0.2; done; exec drone"
    # The drone needs NET_ADMIN + NET_RAW to see/use eth1 (Task 1). netlab core now
    # supports cap-add passthrough (Plan 2 Task 4a: providers/clab.yml attributes.node._keys
    # extended, additive, upstream-worthy -- see ~/otg/netlab/core-patches/clab-cap-add.patch).
    cap-add: [ NET_ADMIN, NET_RAW ]
  group_vars:
    ansible_connection: docker
    ansible_user: root
    netlab_linux_distro: vanilla
graphite.icon: server
