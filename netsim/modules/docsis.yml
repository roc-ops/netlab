---
# Custom DOCSIS access-side configuration module (RocContLab #48, hybrid-lab #57 Layer 2).
#
# Vendor-neutral MAC-domain data model — the CORE subset of ccap-docsis31.v1.yaml that the
# guardrailed renderer (vendor-docs/.../render/casa/casa_render.py) consumes today: MAC domain
# + DS SC-QAM channel set + US SC-QAM physical/logical channels + CM service group + diplexer
# band edges. netlab PLANS this onto a CMTS node and validates it; it NEVER deploys it (the
# CMTS is an `unmanaged`/external node). The render/casa bridge reads nodes.<node>.docsis and
# feeds each MAC domain to casa_render -> guardrail -> Casa CLI.
#
# v1 scope note: mirrors the proven casa_render `mac-domain` spec (apply direction). OFDM/OFDMA
# channels, reusable profiles, service flows / QoS service-classes, subscriber-mgmt, multicast,
# DSG, BPI expand later (issue #48 / #65) as the renderer grows. Attribute names are the
# underscore form of the data-model's hyphenated leaves; the bridge maps back on render.

attributes:
  node:
    mac_domains:
      type: list
      _subtype:
        type: dict
        _keys:
          domain_id:        { type: int, _required: True }
          ip_bundle_ref:    { type: str, _required: True }
          cm_service_group: { type: str, _required: True }
          diplexer:
            type: dict
            _keys:
              upstream_upper_band_edge_mhz:   { type: int }
              downstream_lower_band_edge_mhz: { type: int }
              downstream_upper_band_edge_mhz: { type: int }
          downstream:
            type: dict
            _keys:
              port:       { type: str, _required: True }
              interleave: { type: str }
              channels:
                type: dict
                _keys:
                  start_hz: { type: int }
                  count:    { type: int }
                  step_hz:  { type: int }
              ofdm:                      # DS OFDM channels (DOCSIS 3.1) on the same qam port
                type: list
                _subtype:
                  type: dict
                  _keys:
                    channel:            { type: int, _required: True }   # ofdm-channel index 0..3
                    lower_freq_hz:      { type: int, _required: True }
                    upper_freq_hz:      { type: int, _required: True }
                    plc_freq_hz:        { type: int, _required: True }
                    profiles:           { type: list, _subtype: { type: int } }  # global ofdm-profile idx per slot
                    cyclic_prefix:      { type: int }
                    rolloff_period:     { type: int }
                    sc_spacing:         { type: int }
                    interleave:         { type: int }
                    pilot_scale_factor: { type: int }
                    up_down_trap:       { type: bool }
          upstream:
            type: dict
            _keys:
              port:              { type: str, _required: True }
              physical_channels: { type: list, _subtype: { type: int } }
              width_hz:          { type: int }
              start_hz:          { type: int }
              step_hz:           { type: int }
              logical_channel:   { type: int }
              minislot:          { type: int }
              ofdma:                     # US OFDMA channels (DOCSIS 3.1); Casa supports channel 0 only
                type: list
                _subtype:
                  type: dict
                  _keys:
                    channel:           { type: int, _required: True }   # ofdma channel index (0)
                    lower_freq_hz:     { type: int, _required: True }
                    upper_freq_hz:     { type: int, _required: True }
                    iuc_profile:       { type: int }    # global ofdma iuc-profile idx
                    cyclic_prefix:     { type: int }
                    sc_spacing:        { type: int }
                    symbols_per_frame: { type: int }
                    rolloff_period:    { type: int }
                    pre_equalization:  { type: bool }
                    regular_guardband: { type: bool }
                    up_down_trap:      { type: bool }
    # Global reusable profiles (node-scoped) — referenced BY INDEX from the channels above,
    # so a plan is self-contained instead of assuming pre-provisioned indices. Rendered once,
    # before the domains, and guardrailed (a profile may be DEFINED only on a free index).
    ofdm_profiles:                       # DS OFDM modulation profiles (`ofdm profile <1-640>`)
      type: list
      _subtype:
        type: dict
        _keys:
          index:              { type: int, _required: True }
          profile_modulation: { type: str }
          subcarrier_groups:
            type: list
            _subtype:
              type: dict
              _keys:
                group:           { type: int, _required: True }
                lower_freq_hz:   { type: int }
                upper_freq_hz:   { type: int }
                modulation:      { type: str }
                skip_modulation: { type: str }
    ofdma_iuc_profiles:                  # US OFDMA IUC profiles (`ofdma iuc-profile <1-64>`)
      type: list
      _subtype:
        type: dict
        _keys:
          index: { type: int, _required: True }
          data_iucs:
            type: list
            _subtype:
              type: dict
              _keys:
                iuc:           { type: int, _required: True }
                modulation:    { type: str, _required: True }
                pilot_pattern: { type: int, _required: True }
                minislot_cfg:  { type: int }
          fine_ranging_iuc:
            type: dict
            _keys:
              symbols: { type: int }
              cycle:   { type: int }
              offset:  { type: int }
          initial_ranging_iuc:
            type: dict
            _keys:
              symbols: { type: int }
              cycle:   { type: int }
              offset:  { type: int }
    # Global QoS service classes (node-scoped) — `cable service-class <id>` with a `name` (SCN).
    # MAC-domain / CM-config service flows reference the SCN by name. Guardrailed: a plan may
    # DEFINE a service class only on a free id + free name. Fields are the CableLabs docs-qos
    # leaves (mapped to Casa keywords in render_service_class).
    service_classes:
      type: list
      _subtype:
        type: dict
        _keys:
          id:                       { type: int, _required: True }   # Casa config handle
          name:                     { type: str, _required: True }   # SCN, <=15 chars
          direction:                { type: str }                    # upstream | downstream
          scheduling_type:          { type: str }
          priority:                 { type: int }
          max_traffic_rate:         { type: int }
          max_traffic_burst:        { type: int }
          min_reserved_rate:        { type: int }
          min_reserved_packet:      { type: int }
          max_concatenated_burst:   { type: int }
          peak_traffic_rate:        { type: int }
          max_latency:              { type: int }
          nominal_polling_interval: { type: int }
          tolerated_poll_jitter:    { type: int }
          unsolicited_grant_size:   { type: int }
          nominal_grant_interval:   { type: int }
          tolerated_grant_jitter:   { type: int }
          grants_per_interval:      { type: int }
          dscp_overwrite:           { type: int }
          application_id:           { type: int }
          active_timeout:           { type: int }
          admitted_timeout:         { type: int }
          tos_and_mask:             { type: str }
          tos_or_mask:              { type: str }
          request_policy:           { type: str }
          required_attribute_mask:  { type: str }
          forbidden_attribute_mask: { type: str }
          aqm_enable:               { type: bool }
    # Subscriber management (node-scoped) — CPE filter groups (`docsis submgt ip-filter`, additive)
    # + box-wide `docsis submgt default` singletons. Guardrail: filter groups define a FREE group
    # id; a box-wide default may only be ADDED (never overwrites a live one — it touches every domain).
    subscriber_management:
      type: dict
      _keys:
        defaults:                        # box-wide `docsis submgt default <kw> <val>`
          type: dict
          _keys:
            cpe_active:                  { type: bool }
            cpe_learnable:               { type: bool }
            cpe_max_ipv4:                { type: int }
            cpe_max_ipv6:                { type: int }
            subscriber_downstream_filter:{ type: int }
            subscriber_upstream_filter:  { type: int }
            cm_downstream_filter:        { type: int }
            cm_upstream_filter:          { type: int }
            ps_downstream_filter:        { type: int }
            ps_upstream_filter:          { type: int }
            mta_downstream_filter:       { type: int }
            mta_upstream_filter:         { type: int }
            stb_downstream_filter:       { type: int }
            stb_upstream_filter:         { type: int }
        filter_groups:                   # `docsis submgt ip-filter <grp> <rule> {accept|deny} ...`
          type: list
          _subtype:
            type: dict
            _keys:
              group_id: { type: int, _required: True }
              rules:
                type: list
                _subtype:
                  type: dict
                  _keys:
                    rule_id:                { type: int, _required: True }
                    filter_action:          { type: str }   # permit | deny
                    cm_interface_mask:      { type: str }
                    source_address:         { type: str }
                    destination_address:    { type: str }
                    source_port_start:      { type: int }
                    source_port_end:        { type: int }
                    destination_port_start: { type: int }
                    destination_port_end:   { type: int }
                    ip_protocol:            { type: int }
                    ip_tos_low:             { type: int }
                    ip_tos_high:            { type: int }
                    ip_tos_mask:            { type: int }
