# VXLAN default settings and attributes
#
requires: [ vlan ]
config_after: [ vrf, bgp ]        # VRFs must be created before L3 VXLAN, some platforms also need BGP router_id
transform_after: [ vlan, vrf ]
domain: global
flooding: static
start_vni: 100000
attributes:
  global:
    domain: id
    flooding: { type: str, valid_values: [ static, evpn ] }
    vlans: list
    use_v6_vtep: bool
    # Name of a PRE-EXISTING BGP instance to bind L2VNIs into, for brownfield fabrics where
    # netlab must not own BGP (the evpn module requires the bgp module, which would re-render
    # the BGP carrying a production underlay). Unset => unchanged behaviour.
    # Interpolated directly into a confd config line, so it must not be able to carry a
    # newline (which would inject further configuration -- and indented injected lines
    # historically slipped past the guardrail).
    # `id`, not `str`: this value is interpolated directly into a confd config line, so it must
    # not be able to carry a newline (which would inject further configuration -- and indented
    # injected lines slipped past the guardrail). must_be_id fullmatches [a-zA-Z_][a-zA-Z0-9_-]*.
    bgp_instance: id
  node:
    domain:
    flooding:
    vlans:
    bgp_instance:
  link:
    vtep: bool
no_propagate: [ use_v6_vtep, start_vni ]
use_v6_vtep: false
features:
  vtep6: VXLAN over IPv6
