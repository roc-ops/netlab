name: Render platform integration topologies (tier 1.5)

on:
  push:
    branches-ignore: [ devc ]
    paths:
    - '**.py'
    - '**.yml'
    - '**.j2'
    - 'tests/integration/platform/render-check.sh'
    - '.github/workflows/t-render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Render every platform integration topology offline
      run: |
        ./tests/integration/platform/render-check.sh
